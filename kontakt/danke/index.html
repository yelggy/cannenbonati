<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vielen Dank | Carmen Annen Bonati Art</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,600|Montserrat:700,400|Raleway:600&amp;display=fallback">
<style>
  :root {
    --gold: #b69d78;
    --dark: #19150f;
    --muted: #413e3a;
    --border: #dedad3;
    --bg: #efefef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Lato", sans-serif;
    color: var(--muted);
    background: var(--bg);
  }
  header {
    background: #fff;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
  }
  header a {
    display: inline-block;
    text-decoration: none;
    color: var(--dark);
  }
  header img {
    width: 150px;
    height: auto;
    display: block;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
  }
  .card {
    background: #fff;
    max-width: 520px;
    width: 100%;
    padding: 2.5rem 2rem;
    text-align: center;
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
  }
  h1 {
    margin: 0 0 1rem;
    font-family: "Montserrat", sans-serif;
    font-weight: 700;
    font-size: 2rem;
    color: var(--dark);
  }
  p {
    margin: 0 0 1.75rem;
    line-height: 1.6;
    font-size: 1.05rem;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
  }
  .links a {
    font-family: "Raleway", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--dark);
    border-bottom: 2px solid var(--gold);
    padding: 0.35rem 0.1rem;
    transition: color 0.2s ease;
  }
  .links a:hover,
  .links a:focus {
    color: var(--gold);
  }
  footer {
    background: var(--dark);
    color: #fff;
    text-align: center;
    padding: 1rem;
    font-size: 0.75rem;
  }
  footer a { color: var(--gold); }
</style>
</head>
<body>
  <header>
    <a href="../../">
      <img src="../logo.svg" alt="">
    </a>
  </header>
  <main>
    <div class="card">
      <h1>Vielen Dank</h1>
      <p>Ihre Nachricht wurde erfolgreich übermittelt. Ich melde mich so bald wie möglich bei Ihnen.</p>
      <div class="links">
        <a href="../">Zurück zu Kontakt</a>
        <a href="../../">Zur Startseite</a>
      </div>
    </div>
  </main>
  <footer>
    &copy; Carmen Annen Bonati Art
  </footer>
</body>
</html>
